[project]
name = "read-tabular-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gustavo Sanchez Galarza", email = "gustavosanchezgalarza@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "pandas>=3.1.1",
    "pandas-stubs>=3.1.0.261029",
